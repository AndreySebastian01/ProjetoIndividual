<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <div class="tituloHeader">
            <h1>ARQUIVO SKYWALKER</h1>
            <p>QUIZ COM PERSONAGENS DO EPISÓDIO I-IX</p>
        </div>

        <nav class="navHeader" aria-label="Navegação principal">
            <ol>
                <li class="ativo"><a href="#inicio">Inicio</a></li>
                <li><a href="#cronologia">Cronologia</a></li>
                <li><a href="#quiz">Quiz</a></li>
                <li><a href="#dashboard">Dashboard</a></li>
            </ol>
        </nav>
        <div class="div_buttonsHeader">
            <a href="#quiz" class="botaoQuiz">Fazer o Quiz</a>
        </div>
    </header>

    <main>
        <section class="hero" id="inicio">
            <h1>
                Qual personagem da Saga Skywalker combina com você?
            </h1>
        </section>

        <section class="comoFunciona"></section>
        <section class="modelo"></section>
        <section class="cronologia" id="cronologia"></section>
        <section class="resultado" id="dashboard"></section>
        <section class="cta" id="quiz"></section>
    </main>

    <footer>
        <div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <hr>
        <div></div>
    </footer>

    <script>
        const itensMenu = document.querySelectorAll(".navHeader ol li");

        itensMenu.forEach((item) => {
            item.querySelector("a").addEventListener("click", () => {
                itensMenu.forEach((outroItem) => {
                    outroItem.classList.remove("ativo");
                });
                item.classList.add("ativo");
            });
        });
    </script>
</body>
</html>
